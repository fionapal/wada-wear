<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Wada Wear">
  <meta name="theme-color" content="#faf7f2">
  <meta name="description" content="Match your clothes to Sanzo Wada's curated color combinations">
  <title>Wada Wear</title>
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="app.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/chroma-js/2.4.2/chroma.min.js"></script>
  <script src="data.js"></script>
  <script src="color-engine.js"></script>
</head>
<body>

  <!-- ============================================================
       PIN Lock Overlay
       ============================================================ -->
  <div id="pin-overlay" class="pin-overlay">
    <div class="pin-box">
      <h1 class="pin-title">Wada Wear</h1>
      <p class="pin-subtitle" id="pin-subtitle">Enter your PIN</p>
      <div class="pin-dots" id="pin-dots">
        <span class="pin-dot"></span>
        <span class="pin-dot"></span>
        <span class="pin-dot"></span>
        <span class="pin-dot"></span>
      </div>
      <div class="pin-pad" id="pin-pad">
        <!-- Generated by app.js -->
      </div>
      <p class="pin-error" id="pin-error"></p>
    </div>
  </div>

  <!-- ============================================================
       Main App (hidden behind PIN until unlocked)
       ============================================================ -->
  <div id="app" class="app hidden">

    <!-- Header -->
    <header class="app-header">
      <h1 class="app-title">Wada Wear</h1>
    </header>

    <!-- Views -->
    <main class="view-container">

      <!-- Photo Match View -->
      <section id="view-photo" class="view active">
        <div class="photo-prompt" id="photo-prompt">
          <button type="button" class="btn-photo" id="btn-select-photo">
            <span class="btn-icon">+</span>
            <span class="btn-label">Select a photo</span>
          </button>
          <input type="file" id="file-input" accept="image/*" class="hidden-input">
        </div>

        <div class="photo-result hidden" id="photo-result">
          <div class="photo-image-wrap" id="photo-image-wrap">
            <img id="photo-image" alt="Your garment">
            <div class="photo-pin" id="photo-pin"></div>
          </div>
          <div class="photo-swatch" id="photo-swatch">
            <div class="swatch-preview" id="swatch-preview"></div>
            <span class="swatch-label">Drag the pin to adjust</span>
          </div>
        </div>

        <div class="candidates hidden" id="candidates">
          <h2 class="section-title">Closest matches</h2>
          <div class="candidate-list" id="candidate-list"></div>
        </div>

        <p class="message" id="photo-message"></p>
      </section>

      <!-- Browse Colors View -->
      <section id="view-browse" class="view">
        <nav class="family-tabs" id="family-tabs"></nav>
        <div class="color-grid" id="color-grid"></div>
      </section>

      <!-- My Colors View -->
      <section id="view-mine" class="view">
        <div class="mine-grid" id="mine-grid"></div>
        <p class="empty-state hidden" id="mine-empty">
          No colors saved yet. Use Photo Match or Browse to find your first color.
        </p>
      </section>

      <!-- Combination Detail View -->
      <section id="view-combo" class="view">
        <button type="button" class="btn-back" id="btn-back">&larr; Back</button>
        <div class="combo-header" id="combo-header"></div>
        <div class="combo-list" id="combo-list"></div>
      </section>

    </main>

    <!-- Tab Bar -->
    <nav class="tab-bar">
      <button type="button" class="tab active" data-view="photo">Photo</button>
      <button type="button" class="tab" data-view="browse">Browse</button>
      <button type="button" class="tab" data-view="mine">My Colors</button>
    </nav>
  </div>

  <script src="app.js"></script>
</body>
</html>
